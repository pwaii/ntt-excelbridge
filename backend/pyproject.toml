[project]
name = "xlsx-workflow-backend"
version = "0.1.0"
description = "XLSX data-quality / standardization / update workflow — backend (FastAPI on Lambda)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "mangum>=0.17",          # FastAPI -> Lambda adapter
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
    "openpyxl>=3.1",
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",           # FastAPI TestClient
    "moto>=5.0",             # mock S3/DynamoDB in tests
    "ruff>=0.6",
    "uvicorn[standard]>=0.30", # local FastAPI development server
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI dependency injection uses Depends(...) defaults.
